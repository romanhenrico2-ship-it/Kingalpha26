<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING ALPHA</title><style>body{background:#000;color:#fff;font-family:Arial;padding:10px}h1{color:gold;text-align:center}div{background:#111;margin:10px;padding:15px;border-radius:10px;border:1px solid gold}input{width:100%;padding:12px;margin:5px 0;background:#000;color:#fff;border:1px solid #444}button{width:100%;padding:14px;background:gold;font-weight:bold;border:none;border-radius:8px}</style></head><body><h1>KING ALPHA 👑</h1><div>👑 KINGS: <b id="c">0</b> | FREE: <b id="f">50</b></div><div><h3 style="color:gold">JOIN FREE</h3><input id="n" placeholder="Your name"><input id="w" placeholder="WhatsApp"><button onclick="join()">JOIN NOW FREE 👑</button></div><div><h3 style="color:gold">CHAT</h3><div id="b" style="height:150px;overflow:auto;background:#000;padding:8px">SYSTEM: Welcome Kings!</div><input id="m" placeholder="Message"><button onclick="send()">SEND</button></div><div><h3 style="color:gold">KINGS LIST</h3><div id="l">No Kings yet</div></div><script>let k=+localStorage.k||0;let d=JSON.parse(localStorage.d||'[]');let c=JSON.parse(localStorage.c||'[]');function u(){document.getElementById('c').innerText=k;document.getElementById('f').innerText=50-k;document.getElementById('l').innerHTML=d.map((x,i)=>'👑 #'+(i+1)+' '+x.n).join('<br>')||'No Kings yet';document.getElementById('b').innerHTML=c.join('<br>');}function join(){let n=document.getElementById('n').value;if(!n)return alert('Enter name');k++;d.push({n:n});c.push(n+' JOINED AS KING #'+k);localStorage.k=k;localStorage.d=JSON.stringify(d);localStorage.c=JSON.stringify(c);u();alert('Welcome KING '+n+' #'+k)}function send(){let m=document.getElementById('m').value;if(!m)return;let nm=d.length?d[d.length-1].n:'King';c.push(nm+': '+m);localStorage.c=JSON.stringify(c);document.getElementById('m').value='';u()}u()</script></body></html>
