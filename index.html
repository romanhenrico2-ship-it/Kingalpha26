<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Alpha 26</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0}input,textarea{width:100%;padding:14px;background:#222;border:1px solid #444;color:#fff;border-radius:10px;margin:8px 0}button{width:100%;padding:14px;background:#25D366;border:0;border-radius:10px;font-weight:900}#app{display:none}.top{height:50px;background:#111;display:flex;align-items:center;padding:0 12px;position:fixed;top:0;left:0;right:0}.feed{padding:60px 10px 80px 10px}.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:2px solid #25D366}.t{flex:1;padding:10px;text-align:center;color:#666}.t.on{color:#25D366}video{width:100%;border-radius:12px}</style></head><body>
<div id="reg" style="padding:20px;text-align:center"><div style="width:80px;height:80px;background:gold;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;margin:20px auto">👑</div><h2>King Alpha ALL IN ONE</h2><p style="color:#888;font-size:11px">TikTok + Facebook + Likes Comments Follow Emojis Gifts</p><input id="ph" placeholder="Phone 0713992400"><input id="nm" placeholder="Name"><button style="background:gold;margin-top:10px" onclick="enterApp()">👑 ENTER APP</button></div>
<div id="app"><div class="top"><b id="n1">King</b><span id="balTxt" style="margin-left:auto">R0.00</span></div>
<div id="home" class="feed"><div class="card"><b>🎬 POST VIDEO REAL</b><label style="background:#25D366;color:#000;padding:12px;border-radius:10px;display:block;text-align:center;margin-top:10px;font-weight:900"><input type="file" id="vf" accept="video/*" style="display:none">📹 POST VIDEO</label><div id="vlist"></div></div><div class="card"><b>📝 POST FACEBOOK</b><textarea id="ft" placeholder="What's up? 😊❤️🔥"></textarea><button onclick="postFB()">POST</button><div id="flist"></div></div></div>
<div id="tik" class="feed" style="display:none"><div id="vfull"></div></div>
<div id="wallet" class="feed" style="display:none"><div class="card"><b>💰 Wallet REAL</b><div id="b2" style="font-size:24px;color:#25D366">R0.00</div><button style="background:gold" onclick="ad()">📺 Ad +R0.10</button><button onclick="gift()">🎁 Gift +R2</button></div></div>
<div class="tabs"><div class="t on" onclick="tab('home',this)">Home</div><div class="t" onclick="tab('tik',this)">TikTok</div><div class="t" onclick="tab('wallet',this)">Wallet</div></div></div>
<div id="cm" style="position:fixed;inset:0;background:rgba(0,0,0,.9);display:none"><div style="background:#222;position:fixed;bottom:0;left:0;right:0;border-radius:20px 20px 0 0;padding:15px"><div style="display:flex;justify-content:space-between"><b>Comments</b><button onclick="cm.style.display='none'" style="width:30px">X</button></div><div id="clist" style="margin:10px 0"></div><div style="display:flex;gap:8px"><input id="cinput" placeholder="Comment 😊❤️🔥"><button onclick="addC()" style="width:60px">➤</button></div></div></div>
<script>
let posts=JSON.parse(localStorage.getItem('k26_posts')||'[]'),fposts=JSON.parse(localStorage.getItem('k26_fb')||'[]'),wallet=parseFloat(localStorage.getItem('k26_bal')||'-20'),cur=null,ctype=null,user=JSON.parse(localStorage.getItem('k26')||'null')
if(user){reg.style.display='none';app.style.display='block';n1.textContent=user.name}
function enterApp(){if(ph.value.length<5){alert('Phone');return}user={name:nm.value||'King',phone:ph.value};localStorage.setItem('k26',JSON.stringify(user));reg.style.display='none';app.style.display='block';n1.textContent=user.name;upd()}
function tab(id,el){document.querySelectorAll('.feed').forEach(e=>e.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.t').forEach(e=>e.classList.remove('on'));el.classList.add('on');if(id=='tik')renderVFull()}
function upd(){document.getElementById('balTxt').textContent='R'+wallet.toFixed(2);b2.textContent='R'+wallet.toFixed(2);localStorage.setItem('k26_bal',wallet)}
function ad(){wallet+=0.1;upd();alert('+R0.10 REAL')}function gift(){wallet+=2;upd();alert('+R2 Gift REAL')}
vf.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{posts.unshift({id:Date.now(),video:ev.target.result,name:user.name,likes:0,comments:[],liked:false});localStorage.setItem('k26_posts',JSON.stringify(posts));wallet+=0.1;upd();renderV()};r.readAsDataURL(f)})
function vhtml(p){return `<div class=card><b>${p.name}</b><video src=${p.video} controls></video><div style=display:flex;gap:6px;margin-top:8px;flex-wrap:wrap><button onclick=likeV(${p.id}) style=width:auto;padding:6px 12px;background:${p.liked?'#ff0050':'#222'};color:#fff;border-radius:20px>❤️ ${p.likes} Like</button><button onclick=openC(${p.id},'v') style=width:auto;padding:6px 12px;background:#222;color:#fff;border-radius:20px>💬 ${p.comments.length} Comment</button><button onclick=gift() style=width:auto;padding:6px 12px;background:gold;border-radius:20px>🎁 R2 Gift</button><button style=width:auto;padding:6px 12px;background:#222;color:#fff;border-radius:20px>Follow 😊❤️🔥</button></div></div>`}
function renderV(){vlist.innerHTML=posts.slice(0,3).map(p=>vhtml(p)).join('')||'<p style=color:#666;text-align:center>No videos - POST ONE!</p>'}function renderVFull(){vfull.innerHTML=posts.map(p=>vhtml(p)).join('')||'<p style=color:#666;text-align:center>No videos</p>'}
function likeV(id){let p=posts.find(x=>x.id==id);if(p.liked){p.likes--;p.liked=false;wallet-=0.1}else{p.likes++;p.liked=true;wallet+=0.1}localStorage.setItem('k26_posts',JSON.stringify(posts));upd();renderV();renderVFull()}
function postFB(){let t=ft.value.trim();if(!t)return;fposts.unshift({id:Date.now(),text:t,name:user.name,likes:0,comments:[],liked:false});localStorage.setItem('k26_fb',JSON.stringify(fposts));ft.value='';renderF()}
function renderF(){flist.innerHTML=fposts.map(p=>`<div class=card><b>${p.name}</b><div>${p.text}</div><div style=display:flex;gap:6px;margin-top:8px;flex-wrap:wrap><button onclick=likeF(${p.id}) style=width:auto;padding:6px 12px;background:${p.liked?'#ff0050':'#222'};color:#fff;border-radius:20px>❤️ ${p.likes} Like</button><button onclick=openC(${p.id},'f') style=width:auto;padding:6px 12px;background:#222;color:#fff;border-radius:20px>💬 ${p.comments.length} Comment</button><button style=width:auto;padding:6px 12px;background:#222;color:#fff;border-radius:20px>Follow 😊❤️🔥</button></div></div>`).join('')}
function likeF(id){let p=fposts.find(x=>x.id==id);if(p.liked){p.likes--;p.liked=false}else{p.likes++;p.liked=true}localStorage.setItem('k26_fb',JSON.stringify(fposts));renderF()}
function openC(id,t){cur=id;ctype=t;cm.style.display='block';showC()}function showC(){let a=ctype=='v'?posts:fposts;let p=a.find(x=>x.id==cur);clist.innerHTML=p.comments.length?p.comments.map(c=>`<div style=padding:6px 0;border-bottom:1px solid #333><b>${c.name}:</b> ${c.text}</div>`).join(''):'<p style=color:#666;text-align:center>No comments yet - Be first! 😊❤️🔥</p>'}function addC(){let t=cinput.value.trim();if(!t)return;let a=ctype=='v'?posts:fposts;let p=a.find(x=>x.id==cur);p.comments.push({name:user.name,text:t});localStorage.setItem(ctype=='v'?'k26_posts':'k26_fb',JSON.stringify(a));cinput.value='';wallet+=0.02;upd();showC();renderV();renderVFull();renderF()}
renderV();renderF();upd();
</script></body></html>
