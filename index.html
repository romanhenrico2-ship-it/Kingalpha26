<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>KING ALPHA 26 - FIXED ALL TABS</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;overflow:hidden;height:100vh;display:flex;flex-direction:column}#login{flex:1;display:flex;align-items:center;justify-content:center;background:#000;padding:20px}.card{background:#151515;border:2px solid #FFD700;padding:24px;border-radius:20px;width:100%;max-width:350px;text-align:center}.btn{width:100%;padding:14px;background:#FFD700;color:#000;font-weight:900;border:none;border-radius:12px;margin-top:10px;font-size:15px}input{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:15px}#app{display:none;flex:1;flex-direction:column;height:100vh}.top{background:#111;padding:12px;border-bottom:2px solid #FFD700;display:flex;justify-content:space-between}.tabs{flex:1;overflow-y:auto;background:#000}.tab{display:none;flex-direction:column;min-height:100%}.tab.active{display:flex}.bottom{height:70px;background:#111;border-top:2px solid #FFD700;display:flex;flex-shrink:0}.btab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;opacity:.5;border:none;background:none;color:#fff;cursor:pointer}.btab.active{opacity:1;color:#FFD700;background:#1a1a00}.post{background:#181818;margin-bottom:10px;border:1px solid #222}.post-h{padding:10px;display:flex;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900}.post-content{height:200px;background:#222;display:flex;align-items:center;justify-content:center;font-size:24px}.actions{display:flex;padding:10px;gap:6px}.a-btn{flex:1;padding:8px;background:#222;border-radius:20px;text-align:center;font-size:12px}.chat-item{padding:15px;display:flex;gap:10px;border-bottom:1px solid #222}.bubble{max-width:70%;padding:10px 14px;border-radius:18px;margin:5px 10px;font-size:14px}.me{background:#FFD700;color:#000;margin-left:auto}.them{background:#333}canvas{width:100%;max-height:280px;background:#000;border-radius:10px}.mcard{padding:12px;display:flex;gap:10px;border-bottom:1px solid #222}</style></head><body>

<div class=tabs>
<div id=tab-tiktok class="tab active"><div style=padding:12px><button class=btn onclick=postTikTok()>🎬 POST TIKTOK VIDEO - TAP HERE</button></div><div id=tiktokFeed></div></div>
<div id=tab-fb class=tab><div style=padding:12px><button class=btn onclick=postFB()>📘 POST FACEBOOK - TAP HERE</button></div><div id=fbFeed></div></div>

<div id=tab-picsart class=tab><div style=padding:12px"><h3 style=color:#FFD700>🎨 PICSART EDITOR - FULL</h3><input type=file accept=image/* onchange=loadImg(event) style=margin:10px 0"><canvas id=canvas></canvas><div style=display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick=filterImg('gray')>B&W</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick=filterImg('sepia')>Sepia</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick=addText()>Text</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick="addEm('🔥')">🔥</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick="addEm('👑')">👑</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick="addEm('❤️')">❤️</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px" onclick="addEm('😊')">😊</button><button class=btn style=width:auto;padding:8px 14px;font-size:12px;background:#0f0" onclick=saveImg()>SAVE FREE</button></div></div></div>
<div id=tab-music class=tab><div style=padding:12px"><h3 style=color:#FFD700>🎵 MUSIC - LISTEN FREE OFFLINE</h3><input type=file id=musicFile accept=audio/* onchange=loadMusic(event) style=margin:10px 0"><button class=btn onclick="document.getElementById('musicFile').click()">🎵 UPLOAD MP3 - TAP TO LISTEN FREE</button><div style=background:#1a1a00;padding:16px;border-radius:16px;margin:12px 0;text-align:center;border:1px solid #FFD700"><div style=font-size:40px>🎵</div><b id=songTitle>Amapiano FREE Mix</b><p style=font-size:11px;opacity:.6">No Data • Offline • FREE</p><div style=display:flex;justify-content:center;gap:20px;margin-top:12px"><span style=font-size:28px" onclick=prev()>⏮️</span><div style=width:60px;height:60px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px" onclick=toggle() id=play>▶️</div><span style=font-size:28px" onclick=next()>⏭️</span></div><audio id=audio style=display:none></audio></div></div><div id=musicList></div></div>
</div>
<div class=bottom>
<button class="btab active" onclick="showTab('tiktok',this)"><span style=font-size:22px>🎬</span><span>TikTok FREE</span></button>
<button class=btab onclick="showTab('fb',this)"><span style=font-size:22px>📘</span><span>Facebook FREE</span></button>
<button class=btab onclick="showTab('chat',this)"><span style=font-size:22px>💬</span><span>Chats FREE</span></button>

</div>
<script>
let friends=JSON.parse(localStorage.getItem('kf')||'[{"name":"Thandi","phone":"072111","last":"Picnic? 😊 FREE"},{"name":"Group","phone":"group","last":"Edit done 🎨"}]'),chats=JSON.parse(localStorage.getItem('kc')||'{"072111":[{"from":"them","text":"Hey picnic tomorrow? 🙏😊 FREE"}]}'),cur=null,play=false,idx=0;
function save(){localStorage.setItem('kf',JSON.stringify(friends));localStorage.setItem('kc',JSON.stringify(chats))}
function enterApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';loadF();loadC();loadM()}
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.querySelectorAll('.btab').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function loadF(){let tf=document.getElementById('tiktokFeed');if(!tf.innerHTML){tf.innerHTML=`<div class=post><div class=post-content>🎬 FREE No Data 🔥</div><div class=post-h><div class=avatar>K</div><div><b>King FREE</b><br><span style=font-size:11px">Just now • Cape Town FREE</span></div></div><div class=actions><div class=a-btn>❤️ Like FREE</div><div class=a-btn>💬 Comment 😊</div><div class=a-btn>↗️ Share FREE</div></div></div>`;}let ff=document.getElementById('fbFeed');if(!ff.innerHTML){ff.innerHTML=`<div class=post><div class=post-h><div class=avatar>🇿🇦</div><div><b>Sipho FREE</b><br><span style=font-size:11px">2h • FREE</span></div></div><div style=padding:10px">Braai today! 🇿🇦🔥 FREE No Data 😊❤️👑</div><div class=actions><div class=a-btn>👍 Like FREE</div><div class=a-btn>💬 Comment 😊</div><div class=a-btn>↗️ Share FREE</div></div></div>`;}}
function postTikTok(){let cap=prompt('TikTok caption 😊❤️🔥👑 FREE:');if(!cap)return;document.getElementById('tiktokFeed').innerHTML=`<div class=post><div class=post-content style=background:linear-gradient(45deg,#FFD70022,#F442)>🎬 ${cap}</div><div class=post-h><div class=avatar>K</div><div><b>You FREE</b><br><span style=font-size:11px">Just now FREE</span></div></div><div class=actions><div class=a-btn>❤️ Like FREE</div><div class=a-btn>💬 😊</div><div class=a-btn>↗️ Share FREE</div></div></div>`+document.getElementById('tiktokFeed').innerHTML}
function postFB(){let cap=prompt('Facebook post 😊❤️🔥👑 FREE:');if(!cap)return;document.getElementById('fbFeed').innerHTML=`<div class=post><div class=post-h><div class=avatar>K</div><div><b>You FREE</b><br><span style=font-size:11px">Just now FREE</span></div></div><div style=padding:10px">${cap} 😊❤️🔥👑</div><div class=actions><div class=a-btn>👍 Like FREE</div><div class=a-btn>💬 😊</div><div class=a-btn>↗️ Share</div></div></div>`+document.getElementById('fbFeed').innerHTML}
function loadC(){let l=document.getElementById('chatList');l.innerHTML='';friends.forEach(f=>{l.innerHTML+=`<div class=chat-item onclick="openChat('${f.phone}','${f.name}')"><div class=avatar>${f.name[0]}</div><div><b>${f.name}</b><br><span style=font-size:11px;opacity:.6">${f.last}</span></div></div>`})}
function addFriend(){let v=document.getElementById('newFriend').value||prompt('Add friend Phone/Name FREE:');if(!v)return;friends.unshift({name:v,phone:v,last:'New FREE 👋'});if(!chats[v])chats[v]=[{from:'them',text:'Hey FREE 👋😊'}];save();loadC();document.getElementById('newFriend').value=''}
function openChat(p,n){cur=p;document.getElementById('chatList').style.display='none';document.getElementById('chatWindow').style.display='flex';document.getElementById('chatWith').innerText=n;let b=document.getElementById('messages');b.innerHTML='';(chats[p]||[]).forEach(x=>b.innerHTML+=`<div class="bubble ${x.from=='me'?'me':'them'}">${x.text}</div>`)}
function closeChat(){document.getElementById('chatList').style.display='block';document.getElementById('chatWindow').style.display='none';cur=null}
function sendMsg(){let i=document.getElementById('msgInput'),t=i.value;if(!t||!cur)return;if(!chats[cur])chats[cur]=[];chats[cur].push({from:'me',text:t});document.getElementById('messages').innerHTML+=`<div class="bubble me">${t}</div>`;i.value='';save();setTimeout(()=>{let r=['Sharp FREE! 👑🔥','😂❤️ FREE','Seen ✅ FREE','FREE msg 😊'][Math.floor(Math.random()*4)];chats[cur].push({from:'them',text:r});save();document.getElementById('messages').innerHTML+=`<div class="bubble them">${r}</div>`},700)}
let canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),img=new Image();
function loadImg(e){let f=e.target.files[0],r=new FileReader();r.onload=ev=>{img.onload=()=>{canvas.width=img.width>400?400:img.width;canvas.height=canvas.width*img.height/img.width;ctx.drawImage(img,0,0,canvas.width,canvas.height)};img.src=ev.target.result};r.readAsDataURL(f)}
function filterImg(t){if(!img.src)return alert('Upload photo first!');ctx.drawImage(img,0,0,canvas.width,canvas.height);if(t=='gray')ctx.filter='grayscale(100%)';if(t=='sepia')ctx.filter='sepia(100%)';ctx.drawImage(canvas,0,0,canvas.width,canvas.height);ctx.filter='none'}
function addText(){let t=prompt('Text FREE 😊❤️:');if(!t)return;ctx.font='bold 24px sans-serif';ctx.fillStyle='#FFD700';ctx.fillText(t,20,30)}
function addEm(e){if(!img.src)return alert('Upload photo!');ctx.font='36px serif';ctx.fillText(e,Math.random()*200+20,Math.random()*150+30)}
function saveImg(){let a=document.createElement('a');a.download='king-free.png';a.href=canvas.toDataURL();a.click()}
function loadM(){let m=document.getElementById('musicList');m.innerHTML=`<div class=mcard onclick="playSong('Amapiano Hits - Kabza FREE')"><div style=width:44px;height:44px;background:#FFD700;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000">🎵</div><div><b>Amapiano Hits</b><br><span style=font-size:11px">Kabza • FREE No Data 🔥</span></div></div><div class=mcard onclick="playSong('Mampho - Busta FREE')"><div style=width:44px;height:44px;background:#333;border-radius:8px;display:flex;align-items:center;justify-content:center">🎶</div><div><b>Mampho</b><br><span style=font-size:11px">Busta • FREE</span></div></div><div class=mcard onclick="playSong('King Anthem FREE')"><div style=width:44px;height:44px;background:#FFD700;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000">👑</div><div><b>King Anthem</b><br><span style=font-size:11px">Your Song FREE</span></div></div>`;}
function toggle(){let a=document.getElementById('audio'),b=document.getElementById('play');if(play){a.pause();b.innerText='▶️';play=false}else{if(a.src)a.play();b.innerText='⏸️';play=true}}
function playSong(t){document.getElementById('songTitle').innerText=t;document.getElementById('play').innerText='⏸️';play=true}
function loadMusic(e){let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);let a=document.getElementById('audio');a.src=u;a.play();document.getElementById('songTitle').innerText=f.name;document.getElementById('play').innerText='⏸️';play=true}
function next(){}function prev(){}
</script></body></html>
